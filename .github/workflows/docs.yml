name: Documentation links

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments --no-progress --hidden --exclude-path node_modules --exclude-path .git './**/*.md'
          fail: true
          output: /tmp/lychee-report.md
